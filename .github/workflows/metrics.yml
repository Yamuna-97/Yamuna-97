name: Metrics

on:
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
  schedule:
    - cron: "0 0 * * *"     # once a day at 00:00 UTC
  push:
    branches: ["main"]      # re-render whenever you push to main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required so the action can commit the SVGs back to this repo
    steps:
      # 📅 Isometric Commit Calendar — Half Year
      - name: Isometric commit calendar (half year)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.halfyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
